<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Last.fm 주간 리포트 - 2026-10-26 ~ 2026-11-01</title>
  <style>:root{--bg:#100f0e;--paper:#fbf7ef;--paper-2:#f2e9da;--ink:#1f1b18;--muted:#756b60;--line:rgba(31,27,24,.14);--red:#d51007;--gold:#d99a26;--teal:#0e7c7b;--blue:#2f5f98;--shadow:0 24px 70px rgba(0,0,0,.28);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:radial-gradient(circle at 10% 10%,rgba(213,16,7,.36),transparent 28rem),radial-gradient(circle at 88% 4%,rgba(14,124,123,.34),transparent 26rem),linear-gradient(135deg,#15110f 0%,#201916 48%,#0e1818 100%);min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.page{width:min(1220px,calc(100vw - 28px));margin:0 auto;padding:28px 0 52px}
.shell{background:rgba(251,247,239,.94);border:1px solid rgba(255,255,255,.28);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.hero{position:relative;min-height:520px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);gap:26px;padding:30px;color:white;background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.28)),var(--hero-art);background-size:cover;background-position:center;isolation:isolate}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(16,15,14,.42));z-index:-1}
.topline{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:30px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.mark{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;background:var(--red);color:white;font-weight:900;box-shadow:0 10px 22px rgba(213,16,7,.28)}
.brand h1{margin:0;font-size:18px}
.brand p{margin:3px 0 0;color:rgba(255,255,255,.72);font-size:13px}
.report-controls{display:grid;gap:8px;justify-items:end}
.control-group{display:flex;align-items:center;gap:6px;padding:5px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(0,0,0,.18);backdrop-filter:blur(10px)}
.control-label{padding:0 7px;color:rgba(255,255,255,.62);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.control,.pill,.icon-btn{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:white;border-radius:999px;min-height:32px;padding:0 12px;backdrop-filter:blur(10px)}
.pill.active{background:white;color:#241d19}
.icon-btn{width:34px;padding:0;font-weight:900}
.control{color-scheme:dark;width:146px}
.hero-copy{align-self:end;max-width:660px}
.eyebrow{margin:0 0 14px;color:#ffb1a9;font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.hero h2{margin:0;max-width:690px;font-size:clamp(42px,7vw,82px);line-height:.9}
.summary{margin:20px 0 0;color:rgba(255,255,255,.82);line-height:1.7;font-size:16px}
.hero-side{display:grid;align-content:end;gap:16px}
.cover-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cover-tile{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);transform:translateY(8px);opacity:0;animation:tileIn .55s ease forwards}
.cover-tile:nth-child(2){animation-delay:.06s}
.cover-tile:nth-child(3){animation-delay:.12s}
.cover-tile:nth-child(4){animation-delay:.18s}
.cover-tile:nth-child(5){animation-delay:.24s}
.cover-tile:nth-child(6){animation-delay:.30s}
.cover-tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease,filter .35s ease}
.cover-tile:hover img{transform:scale(1.08);filter:saturate(1.12)}
.cover-tile span{position:absolute;left:8px;right:8px;bottom:8px;color:white;font-size:11px;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes tileIn{to{transform:translateY(0);opacity:1}}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border-bottom:1px solid var(--line)}
.metric{padding:22px 24px;border-right:1px solid var(--line)}
.metric:last-child{border-right:0}
.metric strong{display:block;font-size:clamp(34px,5vw,54px);line-height:.95}
.metric span{display:block;margin-top:7px;color:var(--muted);font-size:13px;font-weight:700}
.body{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:22px;padding:24px;background:linear-gradient(180deg,var(--paper) 0%,#f5efe5 100%)}
.main,.side{display:grid;gap:18px;align-content:start}
.panel{background:rgba(255,255,255,.68);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.7) inset}
.panel-head{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:18px 18px 0}
.panel h3{margin:0;font-size:21px}
.hint{color:var(--muted);font-size:13px}
.panel-body{padding:18px}
.insight-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.insight-card{padding:16px;border-radius:12px;background:var(--paper-2);min-height:132px}
.insight-card b{display:block;margin-bottom:10px}
.insight-card p{margin:0;color:var(--muted);line-height:1.55;font-size:14px}
.compare-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.compare-card{padding:14px;border-radius:12px;background:white;border:1px solid var(--line)}
.compare-card strong{display:block;font-size:26px}
.compare-card span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{border-radius:999px;background:#211c18;color:white;padding:5px 8px;font-size:12px}
.tabs{display:flex;gap:8px;padding:0 18px 18px;overflow-x:auto}
.tab{border:1px solid var(--line);background:white;color:var(--muted);height:36px;padding:0 13px;border-radius:999px;white-space:nowrap}
.tab.active{background:#211c18;color:white;border-color:#211c18}
.chart-section{display:none}
.chart-section.active{display:block}
.rank-list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rank-item{width:100%;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.7);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;text-align:left}
.rank-item:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(31,27,24,.10);border-color:rgba(213,16,7,.28)}
.thumb{width:52px;height:52px;border-radius:9px;object-fit:cover;background:#ded2c2}
.rank-title{min-width:0}
.rank-title strong,.rank-title span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-title span{margin-top:3px;color:var(--muted);font-size:13px}
.count{min-width:56px;text-align:right;color:var(--red);font-weight:900}
.day-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.day-card{min-height:132px;border-radius:12px;padding:12px;background:linear-gradient(180deg,#fff,#f4ecdf);border:1px solid var(--line);display:grid;align-content:space-between}
.day-card strong{font-size:26px}
.day-card span{color:var(--muted);font-size:12px}
.bar{height:8px;border-radius:999px;background:#dfd4c5;overflow:hidden;margin-top:10px}
.fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--red),var(--gold))}
.heat{display:grid;grid-template-columns:repeat(24,minmax(6px,1fr));gap:4px;align-items:end;height:170px}
.hour{border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--teal),var(--blue));min-height:4px;position:relative}
.hour:hover:after{content:attr(data-label);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#211c18;color:white;font-size:12px;padding:5px 7px;border-radius:6px;z-index:5}
.story{margin:0;color:var(--muted);line-height:1.7}
.story+ .story{margin-top:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.button{min-height:40px;border:1px solid var(--line);border-radius:10px;padding:0 14px;background:white;color:var(--ink)}
.button.primary{background:var(--red);border-color:var(--red);color:white}
.mini-list{display:grid;gap:10px}
.mini{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:0;background:transparent;padding:0}
.mini img{width:46px;height:46px;object-fit:cover;border-radius:8px;background:#ded2c2}
.mini strong,.mini span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini span{color:var(--muted);font-size:12px}
.detail{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:rgba(0,0,0,.58);z-index:20}
.detail.open{display:grid}
.detail-card{width:min(720px,100%);display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;background:var(--paper);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.detail-card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#ded2c2}
.detail-card h3{margin:0 0 8px;font-size:30px;line-height:1.05}
.detail-card p{margin:0 0 10px;color:var(--muted);line-height:1.6}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;background:#211c18;color:white;padding:10px 14px;border-radius:10px;z-index:30;transition:opacity .18s ease,transform .18s ease}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:980px){.hero,.body{grid-template-columns:1fr}.hero{min-height:auto}.topline{display:grid}.report-controls{justify-items:start}.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid var(--line)}.insight-grid,.compare-grid{grid-template-columns:1fr}}
@media(max-width:620px){.page{width:calc(100vw - 16px);padding-top:8px}.hero,.body{padding:16px}.control-group{width:100%;border-radius:14px;flex-wrap:wrap}.cover-grid{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:1fr}.metric{border-right:0;border-bottom:1px solid var(--line)}.metric:last-child{border-bottom:0}.detail-card{grid-template-columns:1fr}.hero h2{font-size:42px}}

.compare-bars{grid-column:1/-1;display:grid;gap:10px;padding:14px;border-radius:14px;background:linear-gradient(135deg,#fff,#f3eadb);border:1px solid var(--line)}
.compare-bar-row{display:grid;grid-template-columns:74px minmax(0,1fr) 58px;gap:10px;align-items:center;font-size:13px}
.compare-bar-row span{color:var(--muted);font-weight:800}
.compare-bar-row b{text-align:right}
.compare-track{height:14px;border-radius:999px;background:#dfd4c5;overflow:hidden}
.compare-track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--red),var(--gold));box-shadow:0 0 18px rgba(213,16,7,.26)}
.compare-bar-row.previous .compare-track i{background:linear-gradient(90deg,#7c756b,#b8ad9b);box-shadow:none}
.more-btn{width:100%;margin-top:12px;min-height:42px;border:1px solid var(--line);border-radius:12px;background:#211c18;color:white;font-weight:800}
.more-btn:hover{background:#3a302a}
.heat{height:190px;align-items:stretch}
.hour-wrap{display:grid;grid-template-rows:1fr 18px;align-items:end;gap:6px;min-width:0}
.hour-wrap span{color:var(--muted);font-size:10px;text-align:center}
.hour{width:100%;align-self:end}
.tag-list{grid-column:1/-1}
.comparison-lift{animation:tileIn .35s ease both}
select{font:inherit}
.report-select{width:210px;max-width:42vw}
.pill:disabled,.icon-btn:disabled,.control:disabled{opacity:.42;cursor:not-allowed;filter:saturate(.55)}
.pill:disabled:hover,.icon-btn:disabled:hover{transform:none}
@media(max-width:620px){.report-select{width:100%;max-width:none}}

.deep-dive-panel[hidden]{display:none}
.deep-dive{display:grid;gap:16px}
.deep-section{border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,#fffdf8,#f0e5d4);overflow:hidden}
.deep-section-head{display:grid;gap:6px;padding:18px 18px 0}
.deep-section-head h4{margin:0;font-size:18px}
.deep-section-head p{margin:0;color:var(--muted);line-height:1.55;font-size:14px}
.deep-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:18px}
.deep-item{min-height:126px;display:grid;align-content:start;gap:7px;padding:14px;border-radius:12px;background:rgba(255,255,255,.72);border:1px solid rgba(31,27,24,.10)}
.deep-item span{color:var(--muted);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.deep-item strong{font-size:24px;line-height:1.05;word-break:keep-all}
.deep-item p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
@media(max-width:980px){.deep-items{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.deep-items{grid-template-columns:1fr}.deep-item{min-height:auto}}

.ai-status{display:grid;gap:12px}
.status-badge{display:inline-flex;width:max-content;align-items:center;min-height:30px;border-radius:999px;padding:0 11px;font-size:12px;font-weight:900;letter-spacing:.04em;text-transform:uppercase}
.status-badge.ok{background:#dff5eb;color:#0f6041}
.status-badge.fallback{background:#fff1d6;color:#8a4d00}
.status-list{display:grid;gap:9px;margin:0}
.status-list div{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.status-list dt{color:var(--muted);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.status-list dd{margin:0;color:var(--ink);font-size:13px;line-height:1.45;word-break:break-word}

.profile-dark .clock-base,.profile-dark .clock-value-segment{pointer-events:none}
.tag-flow-line{pointer-events:stroke}
.flow-label{cursor:pointer;outline:none;transition:opacity .18s ease,fill .18s ease}
.flow-label.is-hovered,.flow-label.is-selected{fill:#211c18;font-weight:900}
.flow-label.is-dimmed{opacity:.22}
.flow-label:focus-visible{text-decoration:underline}
.profile-dark{background:#08090b;color:#fff}
.profile-dark .profile-chart-head span{color:#878b94}
.profile-dark+.profile-dark{border-top-color:#25272c}
.tag-stream{cursor:pointer;outline:none;stroke:#08090b;stroke-width:1;transition:opacity .18s ease,filter .18s ease}
.tag-stream.is-hovered,.tag-stream.is-selected{opacity:1;filter:brightness(1.14) drop-shadow(0 3px 5px rgba(0,0,0,.5))}
.tag-stream.is-dimmed{opacity:.12}
.tag-stream:focus-visible{stroke:#fff;stroke-width:2}
.stream-point{cursor:pointer;outline:none;stroke:transparent;stroke-width:2}
.stream-point.is-hovered{fill:#fff;stroke:#08090b}
.profile-dark .stream-point.is-selected{fill:transparent;stroke:transparent}
.stream-point.is-dimmed{opacity:.08}
.stream-point:focus-visible{fill:#fff;stroke:#fff}
.stream-label{fill:#fff;font-size:10px;font-weight:900;cursor:pointer;outline:none;pointer-events:auto}
.stream-label.is-dimmed{opacity:.15}
.stream-label:focus-visible{text-decoration:underline}
.stream-tick{fill:#8d919b;font-size:10px}
.clock-base{fill:#202226;stroke:#08090b;stroke-width:1}
.clock-value-segment{fill:#2580ff;stroke:#08090b;stroke-width:1;transition:opacity .18s ease,filter .18s ease,fill .18s ease}
.clock-hit{cursor:pointer;outline:none;pointer-events:all}
.clock-hit.is-hovered~.clock-value-segment,.clock-hit.is-selected~.clock-value-segment{fill:#55a8ff;filter:drop-shadow(0 0 5px rgba(37,128,255,.55))}
.clock-hit.is-dimmed~.clock-value-segment{opacity:.24}
.clock-hit:focus-visible~.clock-base{stroke:#fff;stroke-width:2}
.profile-dark .clock-core{fill:#08090b;stroke:#08090b;stroke-width:1}
.clock-axis{fill:#a6aab2;font-size:9px}
.profile-dark .clock-stats strong{color:#fff}
.profile-dark .clock-stats span{color:#b4b7be}
.profile-dark .profile-detail{background:#15171b;border-left-color:#2580ff}
.profile-dark .profile-detail span,.profile-dark .profile-detail p{color:#aeb2ba}
.profile-dark .profile-detail strong{color:#fff}
.profile-panel .panel-body{padding:0}
.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:18px;border-top:1px solid var(--line)}
.profile-chart{min-width:0;padding:20px}
.profile-chart:nth-child(odd){border-right:1px solid var(--line)}
.profile-wide{grid-column:1/-1;border-top:1px solid var(--line);border-right:0!important}
.profile-chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.profile-chart-head h4{margin:0;font-size:16px}
.profile-chart-head span{color:var(--muted);font-size:11px;font-weight:800;text-align:right}
.ratio-layout{display:grid;grid-template-columns:minmax(180px,220px) minmax(0,1fr);gap:20px;align-items:center}
.ratio-svg{width:100%;aspect-ratio:1;overflow:visible}
.ratio-ring{cursor:pointer;outline:none;transition:opacity .18s ease}
.ratio-track,.ratio-progress{fill:none;stroke-width:12}
.ratio-track{stroke:#ded5c8;transition:stroke .18s ease}
.ratio-progress{stroke-linecap:round;transform:rotate(-90deg);transform-origin:100px 100px;animation:profileDraw .8s ease;transition:filter .18s ease,stroke-width .18s ease}
.ratio-marker{fill:#211c18;stroke:#fff;stroke-width:1.5}
.ratio-ring.is-hovered .ratio-progress,.ratio-ring.is-selected .ratio-progress{stroke-width:15;filter:drop-shadow(0 3px 4px rgba(31,27,24,.22))}
.ratio-ring:focus-visible .ratio-track{stroke:#8b5cf6}
.ratio-center-label{fill:#bcb2a4;font-size:6px;font-weight:900}
.ratio-center-value{fill:#fff;font-size:12px;font-weight:900}
.ratio-detail{display:grid;gap:5px}
.ratio-row{width:100%;display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:7px 9px;align-items:center;padding:10px 8px;border:1px solid transparent;border-bottom-color:var(--line);border-radius:8px;background:transparent;color:var(--ink);text-align:left;transition:background .18s ease,border-color .18s ease,transform .18s ease}
.ratio-row:hover,.ratio-row.is-selected{background:#fff;border-color:var(--line);transform:translateX(2px)}
.ratio-row:focus-visible{outline:2px solid #8b5cf6;outline-offset:2px}
.ratio-row i{width:8px;height:8px;border-radius:50%}
.ratio-row span{font-size:12px;font-weight:800}
.ratio-row strong{font-size:22px;line-height:1}
.ratio-row small{grid-column:2/-1;color:var(--muted);font-size:10px}
.fingerprint-wrap{display:grid;justify-items:center}
.fingerprint-svg{width:min(100%,310px);aspect-ratio:1;overflow:visible}
.radar-grid,.radar-spoke{fill:none;stroke:#cfc5b7;stroke-width:1}
.radar-grid{stroke-dasharray:3 4}
.radar-previous{fill:rgba(117,107,96,.10);stroke:#756b60;stroke-width:1.5;stroke-dasharray:5 4}
.radar-current{fill:rgba(139,92,246,.22);stroke:#8b5cf6;stroke-width:2;transform-origin:140px 140px;animation:radarIn .55s ease;transition:opacity .18s ease}
.radar-label{fill:#62584f;font-size:10px;font-weight:800}
.radar-node{fill:#8b5cf6;stroke:#fff;stroke-width:2;cursor:pointer;outline:none;transition:r .18s ease,filter .18s ease}
.radar-node.is-hovered,.radar-node.is-selected{r:8;filter:drop-shadow(0 2px 4px rgba(31,27,24,.3))}
.radar-node:focus-visible{stroke:#211c18;stroke-width:3}
.profile-legend{display:flex;gap:16px;justify-content:center;color:var(--muted);font-size:11px}
.profile-legend span{display:flex;align-items:center;gap:6px}
.profile-legend i{width:9px;height:9px;border-radius:50%}
.legend-current{background:#8b5cf6}
.legend-previous{background:#756b60}
.tag-flow-svg{display:block;width:100%;max-height:300px;overflow:visible}
.tag-flow-line{cursor:pointer;outline:none;transition:opacity .18s ease,filter .18s ease,stroke-width .18s ease}
.tag-flow-hit{cursor:pointer}
.tag-flow-line.is-hovered,.tag-flow-line.is-selected{opacity:1!important;filter:drop-shadow(0 3px 3px rgba(31,27,24,.24))}
.tag-flow-line.is-dimmed{opacity:.12!important}
.tag-flow-line:focus-visible{filter:drop-shadow(0 0 3px #211c18)}
.flow-label{fill:#756b60;font-size:11px;font-weight:700}
.flow-current-label{fill:#211c18;font-weight:900}
.flow-heading{fill:#9b9083;font-size:9px;font-weight:900;letter-spacing:.08em}
.clock-layout{display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:28px;align-items:center;max-width:720px;margin:0 auto}
.clock-svg{width:100%;aspect-ratio:1;overflow:visible}
.clock-guide{fill:none;stroke:#d8cec0;stroke-width:1;stroke-dasharray:3 5}
.clock-core{fill:#211c18;stroke:#fff;stroke-width:3}
.clock-bar{cursor:pointer;outline:none;transform-box:fill-box;transform-origin:center bottom;animation:clockRise .55s ease;transition:opacity .18s ease,filter .18s ease,stroke-width .18s ease}

const $ = (selector) => document.querySelector(selector);
const $$ = (selector) => [...document.querySelectorAll(selector)];
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const img = (src) => src || fallbackImage;

function profileAttrs({ chart, key, title, value, note }) {
  return `data-profile-item data-profile-chart="${esc(chart)}" data-profile-key="${esc(key)}" data-profile-title="${esc(title)}" data-profile-value="${esc(value)}" data-profile-note="${esc(note)}" tabindex="0" role="button"`;
}

function currentFilename() {
  return decodeURIComponent(location.pathname.split(/[\\/]/).pop() || "");
}

async function refreshRegistry() {
  try {
    const res = await fetch("./report-registry.json", { cache: "no-store" });
    if (!res.ok) return;
    const registry = await res.json();
    if (Array.isArray(registry) && registry.length) {
      state.registry = registry;
      renderReportControls();
    }
  } catch {
    // Standalone local HTML can still use its embedded registry.
  }
}

function reportsFor(period) {
  return state.registry.filter((report) => report.period === period).sort((a, b) => a.start.localeCompare(b.start));
}

function currentRegistryEntry() {
  const file = currentFilename();
  return state.registry.find((report) => report.file === file)
    || state.registry.find((report) => report.period === state.report.kind && report.start === state.report.startDate);
}

function renderReportControls() {
  const entry = currentRegistryEntry();
  const reports = reportsFor(state.report.kind);
  const index = reports.findIndex((report) => report.file === entry?.file);
  for (const [id, offset] of [["#previousReport", -1], ["#nextReport", 1]]) {
    const link = $(id);
    const target = index >= 0 ? reports[index + offset] : null;
    link.hidden = !target;
    if (target) {
      link.href = "./" + target.file;
      link.setAttribute("aria-label", `${link.textContent.trim()} 리포트, ${target.label}`);
    }
  }
}

function signed(value) {
  return (value > 0 ? "+" : "") + value.toLocaleString();
}

function periodComparisonLabels(kind) {
  if (kind === "weekly") return { previous: "지난주", current: "이번 주" };
  if (kind === "monthly") return { previous: "지난달", current: "이번 달" };
  return { previous: "전년", current: "올해" };
}

function formatListeningDate(date, monthOnly) {
  const [, month, day] = date.split("-");
  return monthOnly ? `${Number(month)}월` : `${Number(month)}월 ${Number(day)}일`;
}

function render() {
  const r = state.report;
  const album = r.topAlbums[0];
  $("#headline").textContent = r.headline;
  $("#summaryText").textContent = album ? `${album.artist} · ${album.album} · ${album.count.toLocaleString()}회` : "앨범 기록이 없어요.";
  $("#summaryDetail").textContent = r.summary;
  $("#storyText").textContent = r.story;
  $("#recommendationTitle").textContent = r.recommendation.title;
  $("#recommendationAbout").textContent = r.recommendation.about;
  $("#recommendationWhy").textContent = r.recommendation.why;
  $("#mScrobbles").textContent = r.total.toLocaleString();
  renderReportControls();
  renderCovers();
  renderHighlights();
  renderInsights();
  renderComparison();
  renderPeriodFocus();
  renderDeepDive();
  renderListeningProfile();
  renderCharts();
  renderDays();
  renderAiStatus();
}

function renderHighlights() {
  const r = state.report;
  const track = r.topTracks[0];
  const album = r.topAlbums[0];
  const peak = r.days.reduce((best, day) => day.count > (best?.count || 0) ? day : best, null);
  const latest = r.tagTimeline?.at(-1)?.tags?.[0];
  const sustain = r.sustainedAlbum;
  const cards = [];
  if (r.kind === "weekly" && track) cards.push(["가장 많이 들은 곡", track.title, `${track.artist} · ${track.count.toLocaleString()}회`, track, "track"]);
  if (r.kind !== "weekly" && sustain) {
    const unit = r.kind === "yearly" ? "개월" : "주";
    cards.push(["꾸준히 들은 앨범", sustain.album, `${sustain.artist} · ${sustain.activeBuckets}${unit}에 걸쳐 들었어요`, sustain, "album"]);
  }
  if (r.kind !== "weekly" && !sustain && album) cards.push(["가장 많이 들은 앨범", album.album, `${album.artist} · ${album.count.toLocaleString()}회`, album, "album"]);
  if (r.kind === "monthly" && latest) cards.push(["이번 달 대표 태그", latest.name, "최근 6개월의 흐름 보기", null, "tags"]);
  if (peak) cards.push([r.kind === "yearly" ? "가장 많이 들은 달" : "가장 많이 들은 날", formatListeningDate(peak.order, r.kind === "yearly"), `${peak.count.toLocaleString()}회`]);
  $("#highlights").innerHTML = cards.map(([label, value, note, item, type]) => {
    const content = `<span>${esc(label)}</span><strong>${esc(value)}</strong><small>${esc(note)}</small>`;
    if (item) return `<button class="snapshot" type="button" data-detail='${payload(item, type)}'>${content}</button>`;
    if (type === "tags") return `<a class="snapshot" href="#tagsTitle">${content}</a>`;
    return `<article class="snapshot">${content}</article>`;
  }).join("") || '<p class="profile-empty">이 기간에 재생 기록이 없어요.</p>';
}

function payload(item, type) {
  return esc(JSON.stringify({ type, ...item }));
}

function renderCovers() {
  const album = state.report.topAlbums[0];
  if (!album) {
    $("#coverGrid").hidden = true;
    return;
  }
  $("#coverGrid").innerHTML = `<button type="button" data-detail='${payload(album, "album")}'><img src="${esc(img(album.image))}" alt="${esc(album.album)} 앨범 커버"></button>`;
}

function renderInsights() {
  $("#insights").innerHTML = (state.report.insights || []).map(([title, body]) => `<article class="insight-card"><b>${esc(title)}</b><p>${esc(body)}</p></article>`).join("");
}

function renderComparison() {
  const c = state.report.comparison;
  const available = c.previousAvailable ?? (c.previousTotal > 0);
  const previous = periodComparisonLabels(state.report.kind).previous;
  const change = c.delta === 0 ? `${previous}와 같아요`
    : `${previous}보다 ${Math.abs(c.delta).toLocaleString()}회 ${c.delta > 0 ? "증가" : "감소"}`;
  $("#mChange").textContent = available
    ? `${change}${c.percent == null || c.delta === 0 ? "" : ` (${c.percentText})`}`
    : "직전 기간의 기록이 없어요.";
  $("#comparisonGrid").innerHTML = `<span>${esc(c.previousRange || "직전 기간")}</span><strong>${available ? c.previousTotal.toLocaleString() + "회" : "기록 없음"}</strong>`;
}

function renderPeriodFocus() {
  const focus = state.report.periodFocus || { title: "Period Focus", cards: [] };
  $("#periodFocusTitle").textContent = focus.title;
  $("#periodFocus").innerHTML = (focus.cards || []).map((card) => `<article class="insight-card"><b>${esc(card.label)} · ${esc(card.value)}</b><p>${esc(card.note)}</p></article>`).join("");

function renderDays() {
  const report = state.report;
  const yearly = report.kind === "yearly";
  const start = new Date(report.startDate);
  const end = new Date(report.endDate);
  const counts = new Map(report.days.map((day) => [day.order, day.count]));
  const buckets = [];
  for (const date = new Date(start); date <= end;) {
    const key = date.toISOString().slice(0, yearly ? 7 : 10);
    buckets.push({label: formatListeningDate(key, yearly), count: counts.get(key) || 0});
    if (yearly) date.setUTCMonth(date.getUTCMonth() + 1);
    else date.setUTCDate(date.getUTCDate() + 1);
  }
  const peak = buckets.reduce((best, bucket) => bucket.count > best.count ? bucket : best, buckets[0]);
  const max = Math.max(peak.count, 1);
  const bars = buckets.map((bucket) => {
    const label = `${bucket.label} · ${bucket.count.toLocaleString()}회`;
    return `<button type="button" class="pace-bar" aria-label="${esc(label)}" aria-pressed="${bucket === peak}" style="--pace-height:${bucket.count / max * 100}%"><i></i></button>`;
  }).join("");
  $("#dayGrid").innerHTML = `<div class="pace-chart" style="--pace-slots:${buckets.length}">${bars}</div><div class="pace-axis"><span>${esc(buckets[0].label)}</span><span>${esc(buckets.at(-1).label)}</span></div><p class="pace-readout" id="paceReadout" aria-live="polite">${esc(peak.label)} · ${peak.count.toLocaleString()}회</p>`;
}

function renderMusicRatio() {

function renderFingerprint() {
  const fingerprint = state.report.listeningProfile?.fingerprint || {};
  const current = fingerprint.current || { consistency: 0, discovery: 0, variety: 0, concentration: 0, replay: 0 };
  const previous = fingerprint.previous || { consistency: 0, discovery: 0, variety: 0, concentration: 0, replay: 0 };
  const axes = [
    ["꾸준함", "consistency"],
    ["한 번 듣기", "discovery"],
    ["다양성", "variety"],
    ["집중도", "concentration"],
    ["반복 재생", "replay"]
  ];
  const center = 140;
  const radius = 86;
  const axisPoints = axes.map((_, index) => polarPoint(center, center, radius, index * 72 - 90));
  const grid = [0.33, 0.66, 1].map((scale) => `<polygon class="radar-grid" points="${axisPoints.map((point) => `${center + (point.x - center) * scale},${center + (point.y - center) * scale}`).join(" ")}"></polygon>`).join("");
  const spokes = axisPoints.map((point) => `<line class="radar-spoke" x1="${center}" y1="${center}" x2="${point.x}" y2="${point.y}"></line>`).join("");
  const labels = axes.map(([label], index) => {
    const point = polarPoint(center, center, 116, index * 72 - 90);
    return `<text class="radar-label" x="${point.x}" y="${point.y}" text-anchor="${point.x < center - 10 ? "end" : point.x > center + 10 ? "start" : "middle"}">${label}</text>`;
  }).join("");
  const previousAvailable = Boolean(fingerprint.previous) && (state.report.comparison.previousAvailable ?? (state.report.comparison.previousTotal > 0));
  const previousPoints = previousAvailable ? radarMetricPoints(previous, axes, center, radius) : "";
  const currentPoints = radarMetricPoints(current, axes, center, radius);
  const nodes = axes.map(([label, key], index) => {
    const score = Number(current[key] || 0);
    const before = Number(previous[key] || 0);
    const point = polarPoint(center, center, radius * score / 100, index * 72 - 90);
    return `<circle class="radar-node" cx="${point.x}" cy="${point.y}" r="5" ${profileAttrs({ chart: "fingerprint", key, title: label, value: `${score} / 100`, note: previousAvailable ? `직전 ${before} · ${fingerprintInfo[key]}` : fingerprintInfo[key] })}></circle>`;
  }).join("");
  $("#listeningFingerprint").innerHTML = `<div class="fingerprint-wrap"><svg class="fingerprint-svg" viewBox="0 0 280 280" role="img" aria-label="직전 기간과 비교한 청취 성향">${grid}${spokes}${previousAvailable ? `<polygon class="radar-previous" points="${previousPoints}"></polygon>` : ""}<polygon class="radar-current" points="${currentPoints}"></polygon>${nodes}${labels}</svg><div class="profile-legend"><span><i class="legend-current"></i>현재</span>${previousAvailable ? '<span><i class="legend-previous"></i>직전</span>' : ""}</div></div><div class="profile-detail" id="fingerprintDetail"></div>`;
  setInitialProfileDetail("fingerprint", "consistency");
}

function renderTagMovement() {
  const report = state.report;
  const timeline = report.tagTimeline || [];
  const monthOnly = report.kind !== "weekly";
  const dateLabel = (slot) => formatListeningDate(slot.startDate, monthOnly);
  const fullLabel = (slot) => `${slot.startDate.slice(0, 4)}년 ${dateLabel(slot)}`;
  const percent = (value) => value == null ? "—" : `${value.toFixed(1)}%`;
  const scores = timeline.map((slot) => new Map(slot.scrobbles > 0
    ? (slot.tags || []).filter((tag) => tag.score > 0 && tag.score <= slot.scrobbles)
      .map((tag) => [tag.name, 100 * tag.score / slot.scrobbles])
    : []));
  const weights = new Map();
  for (const row of scores) {
    for (const [name, value] of row) weights.set(name, (weights.get(name) || 0) + value);
  }
  const current = scores.at(-1);
  const previous = scores.at(-2);
  const leaders = (row) => [...(row?.keys() || [])].slice(0, 3);
  const historical = [...weights.keys()].sort((a, b) => weights.get(b) - weights.get(a) || a.localeCompare(b));
  const names = [...new Set([...leaders(current), ...leaders(previous), ...historical])].slice(0, 8);
  $("#tagMovementRange").textContent = timeline.length ? `${fullLabel(timeline[0])} – ${fullLabel(timeline.at(-1))}` : "";
  if (!names.length) {
    $("#tagMovement").innerHTML = '<p class="profile-empty">이 기간에 표시할 태그 기록이 없어요.</p>';
    return;
  }

  const palette = ["#ae80ff", "#428bf5", "#3dcfba", "#e17cb8", "#6a65e1", "#328ca6", "#daa864", "#9ec6f8"];
  const width = timeline.length > 6 ? 820 : 600;
  const step = (width - 68) / Math.max(timeline.length - 1, 1);
  const xAt = (index) => 34 + step * index;
  const totals = scores.map((row) => names.reduce((total, name) => total + (row.get(name) || 0), 0));
  const scale = 142 / Math.max(...totals, 1);
  const edges = totals.map((total) => 86 - total * scale / 2);
  const pair = report.kind === "yearly"
    ? { previous: dateLabel(timeline.at(-2)), current: dateLabel(timeline.at(-1)) }
    : periodComparisonLabels(report.kind);
  const layers = names.map((name, index) => {
    const points = scores.map((row, periodIndex) => {
      const value = row.get(name);
      if (value == null) return null;
      const top = edges[periodIndex];
      edges[periodIndex] += value * scale;
      return { x: xAt(periodIndex), top, bottom: edges[periodIndex] };
    });
    const before = previous?.get(name);
    const after = current.get(name);
    const delta = before == null || after == null ? null : Math.round((after - before) * 10) / 10;
    const value = `${percent(before)} → ${percent(after)}`;
    const note = delta == null ? "두 기간에 모두 기록된 태그의 증감을 표시해요." : `${pair.previous}보다 ${signed(delta)}%p`;
    const attrs = profileAttrs({ chart: "tags", key: name, title: name, value, note });
    const label = esc(`${name}, ${pair.previous} ${percent(before)}, ${pair.current} ${percent(after)}`);
    return { name, color: palette[index], points, attrs, label, before, after, delta };
  });

  const bands = layers.map(({ points, color, attrs, label }) =>
    `<path class="tag-stream" fill="${color}" d="${streamBandPath(points, step)}" ${attrs} aria-label="${label}"></path>`).join("");
  const labels = layers.map(({ name, points }) => {
    const last = points.at(-1);
    const thickness = (point) => point ? point.bottom - point.top : 0;
    const spot = thickness(last) >= 18 ? last
      : points.reduce((best, point) => thickness(point) > thickness(best) ? point : best, null);
    if (!spot || thickness(spot) < 18) return "";
    const end = spot.x >= width / 2;
    return `<text class="stream-band-name" x="${spot.x + (end ? -8 : 8)}" y="${(spot.top + spot.bottom) / 2 + 4}" text-anchor="${end ? "end" : "start"}" aria-hidden="true">${esc(name)}</text>`;
  }).join("");
  const ticks = timeline.map((slot, index) => {
    const emphasis = index >= timeline.length - 2;
    const missing = scores[index].size === 0;
    return `<g class="stream-date${emphasis ? " stream-recent" : ""}"><line x1="${xAt(index)}" x2="${xAt(index)}" y1="10" y2="162"></line><text class="stream-tick" x="${xAt(index)}" y="183" text-anchor="middle">${esc(dateLabel(slot))}</text>${missing ? `<text class="stream-missing" x="${xAt(index)}" y="86" text-anchor="middle">—</text>` : ""}</g>`;
  }).join("");
  const rows = layers.map(({ name, color, attrs, label, before, after, delta }) =>
    `<button type="button" class="tag-compare-row" ${attrs} aria-label="${label}"><span><i style="background:${color}"></i>${esc(name)}</span><span>${percent(before)}</span><strong>${percent(after)}</strong><small>${delta == null ? "—" : `${signed(delta)}%p`}</small></button>`).join("");
  $("#tagMovement").innerHTML = `<p class="tag-method">태그별 흐름 · 띠가 두꺼울수록 재생 100회당 태그 점수가 높아요.</p><svg class="tag-flow-svg" viewBox="0 0 ${width} 192" role="group" aria-label="기간별 태그 흐름">${bands}${ticks}${labels}</svg><div class="tag-compare"><div class="tag-compare-head"><span>태그</span><span>${pair.previous}</span><strong>${pair.current}</strong><span>증감</span></div>${rows}</div><p class="tag-method tag-gap-note">— 표시는 태그가 집계되지 않았거나 상위 태그에 들지 않은 경우예요.</p>`;
}

function streamBandPath(points, step) {
  const paths = [];
  let section = [];
  for (let index = 0; index <= points.length; index += 1) {
    const point = points[index];
    if (point) {
      if (!section.length && (index > 0 || !points[1])) section.push(streamTip(point, -step / (index === 0 ? 4 : 2)));
      section.push(point);
    } else if (section.length) {
      if (index < points.length || !points[index - 2]) {
        section.push(streamTip(section.at(-1), step / (index === points.length ? 4 : 2)));
      }
      const upper = section.map(({ x, top }) => ({ x, y: top }));
      const lower = section.reverse().map(({ x, bottom }) => ({ x, y: bottom }));
      paths.push(`M ${upper[0].x} ${upper[0].y}${streamCurve(upper)} L ${lower[0].x} ${lower[0].y}${streamCurve(lower)} Z`);
      section = [];
    }
  }
  return paths.join(" ");
}

function streamTip(point, offset) {
  const middle = (point.top + point.bottom) / 2;
  return { x: point.x + offset, top: middle, bottom: middle };
}

function streamCurve(points) {
  return points.slice(1).map((point, index) => {
    const previous = points[index];
    const middle = (previous.x + point.x) / 2;
    return ` C ${middle} ${previous.y} ${middle} ${point.y} ${point.x} ${point.y}`;
  }).join("");
}

function renderListeningClock() {
  const hours = state.report.hours || new Array(24).fill(0);
  const max = Math.max(...hours, 1);
  const busiest = hours.indexOf(max);
  const segments = hours.map((count, hour) => {
    const start = hour * 15 - 89.2;
    const end = (hour + 1) * 15 - 90.8;
    const valueRadius = 55 + count / max * 59;
    const time = `${String(hour).padStart(2, "0")}:00`;
    const attrs = profileAttrs({ chart: "clock", key: String(hour), title: time, value: `${count.toLocaleString()}회`, note: `${time}-${String(hour).padStart(2, "0")}:59 KST` });
    return `<g class="clock-segment"><path class="clock-hit" d="${donutSectorPath(130, 130, 54, 116, start, end)}" fill="transparent" ${attrs}></path><path class="clock-base" d="${donutSectorPath(130, 130, 55, 114, start, end)}"></path>${count ? `<path class="clock-value-segment" d="${donutSectorPath(130, 130, 55, valueRadius, start, end)}"></path>` : ""}</g>`;
  }).join("");
  $("#listeningClock").innerHTML = `<div class="clock-layout"><svg class="clock-svg" viewBox="0 0 260 260" role="img" aria-label="한국 시간 기준 시간대별 재생">${segments}<circle class="clock-core" cx="130" cy="130" r="53"></circle><text class="clock-axis" x="130" y="96" text-anchor="middle">00</text><text class="clock-axis" x="165" y="134" text-anchor="middle">06</text><text class="clock-axis" x="130" y="171" text-anchor="middle">12</text><text class="clock-axis" x="94" y="134" text-anchor="middle">18</text></svg><div><div class="clock-stats"><strong>${String(busiest).padStart(2, "0")}:00</strong><span>가장 많이 들은 시간</span><strong>${max.toLocaleString()}</strong><span>이 시간의 재생 횟수</span><strong>${Math.round(timeBandTotal(hours, 21, 5) / Math.max(state.report.total, 1) * 100)}%</strong><span>야간 재생 비율 · 21:00-04:59</span></div><div class="profile-detail profile-detail-dark" id="clockDetail"></div></div></div>`;
  setInitialProfileDetail("clock", String(busiest));
}

function donutSectorPath(cx, cy, innerRadius, outerRadius, startDegrees, endDegrees) {
  const outerStart = polarPoint(cx, cy, outerRadius, startDegrees);
  const outerEnd = polarPoint(cx, cy, outerRadius, endDegrees);
  const innerEnd = polarPoint(cx, cy, innerRadius, endDegrees);
  const innerStart = polarPoint(cx, cy, innerRadius, startDegrees);
  const largeArc = Math.abs(endDegrees - startDegrees) > 180 ? 1 : 0;
  return `M ${outerStart.x} ${outerStart.y} A ${outerRadius} ${outerRadius} 0 ${largeArc} 1 ${outerEnd.x} ${outerEnd.y} L ${innerEnd.x} ${innerEnd.y} A ${innerRadius} ${innerRadius} 0 ${largeArc} 0 ${innerStart.x} ${innerStart.y} Z`;
}

function radarMetricPoints(metrics, axes, center, radius) {
  return axes.map(([, key], index) => {
    const score = Math.max(0, Math.min(100, Number(metrics[key] || 0)));
    const point = polarPoint(center, center, radius * score / 100, index * 72 - 90);
    return `${point.x},${point.y}`;
  }).join(" ");
}

function polarPoint(cx, cy, radius, degrees) {
  const radians = degrees * Math.PI / 180;
  return { x: Number((cx + Math.cos(radians) * radius).toFixed(2)), y: Number((cy + Math.sin(radians) * radius).toFixed(2)) };
}

function timeBandTotal(hours, start, end) {
  return hours.reduce((sum, count, hour) => {
    const inBand = start < end ? hour >= start && hour < end : hour >= start || hour < end;
    return sum + (inBand ? count : 0);
  }, 0);
}

function setInitialProfileDetail(chart, key) {
  const item = $$(`[data-profile-chart="${chart}"]`).find((candidate) => candidate.dataset.profileKey === key && candidate.tabIndex >= 0);
  if (item) selectProfileItem(item, true);
}

function selectProfileItem(item, initial = false) {
  const chart = item.dataset.profileChart;
  const key = item.dataset.profileKey;
  $$(`[data-profile-chart="${chart}"]`).forEach((candidate) => {
    candidate.classList.toggle("is-selected", candidate.dataset.profileKey === key);
    candidate.setAttribute("aria-pressed", candidate.dataset.profileKey === key ? "true" : "false");
  });
  const detail = $(`#${chart}Detail`);
  if (detail) {
    detail.innerHTML = `<span>${esc(item.dataset.profileTitle)}</span><strong>${esc(item.dataset.profileValue)}</strong><p>${esc(item.dataset.profileNote)}</p>`;
  }
  if (chart === "clock") updateClockCenter(item, initial ? "최다 재생" : "선택한 시간");
}

function setProfileHover(item, active) {
  const chart = item.dataset.profileChart;
  const key = item.dataset.profileKey;
  $$(`[data-profile-chart="${chart}"]`).forEach((candidate) => {
    candidate.classList.toggle("is-hovered", active && candidate.dataset.profileKey === key);
    candidate.classList.toggle("is-dimmed", active && candidate.dataset.profileKey !== key);
  });
  if (chart === "clock") {
    if (active) updateClockCenter(item, "시간대");
    else {
      const selected = $$('[data-profile-chart="clock"].is-selected').find((candidate) => candidate.tabIndex >= 0);
      if (selected) updateClockCenter(selected, "선택한 시간");
    }
  }
}

function updateClockCenter(item, label) {
  if (!item || !$("#clockCenterLabel")) return;
  $("#clockCenterLabel").textContent = label;

  $("#clockCenterSub").textContent = item.dataset.profileValue;

function showProfileTooltip(item, event) {
  const tooltip = $("#profileTooltip");
  tooltip.innerHTML = `<b>${esc(item.dataset.profileTitle)}</b><strong>${esc(item.dataset.profileValue)}</strong><span>${esc(item.dataset.profileNote)}</span>`;
  tooltip.classList.add("show");
  positionProfileTooltip(event);
}

function positionProfileTooltip(event) {
  const tooltip = $("#profileTooltip");
  const rect = tooltip.getBoundingClientRect();
  const sourceRect = event.currentTarget?.getBoundingClientRect?.() || event.target?.getBoundingClientRect?.();
  const x = Number.isFinite(event.clientX) && event.clientX ? event.clientX : sourceRect?.left + sourceRect?.width / 2 || 16;
  const y = Number.isFinite(event.clientY) && event.clientY ? event.clientY : sourceRect?.top || 16;
  tooltip.style.left = `${Math.max(8, Math.min(window.innerWidth - rect.width - 8, x + 14))}px`;
  tooltip.style.top = `${Math.max(8, Math.min(window.innerHeight - rect.height - 8, y + 14))}px`;
}

function hideProfileTooltip() {
  $("#profileTooltip").classList.remove("show");
}

function drawCanvas() {
  const r = state.report;
  const canvas = document.createElement("canvas");
  canvas.width = 1200;
  canvas.height = 1500;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#100f0e";
  ctx.fillRect(0, 0, 1200, 1500);
  const g = ctx.createLinearGradient(0, 0, 1200, 1500);
  g.addColorStop(0, "#d51007");
  g.addColorStop(.55, "#171210");
  g.addColorStop(1, "#0e7c7b");
  ctx.globalAlpha = .72;
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1200, 1500);
  ctx.globalAlpha = 1;
  round(ctx, 82, 82, 1036, 1336, 28);
  ctx.fillStyle = "#fbf7ef";
  ctx.fill();
  ctx.fillStyle = "#d51007";
  round(ctx, 132, 132, 74, 74, 14);
  ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.font = "900 30px Segoe UI, Arial";
  ctx.fillText("fm", 153, 180);
  ctx.fillStyle = "#d51007";
  ctx.font = "900 25px Segoe UI, Arial";
  ctx.fillText("LAST.FM LISTENING REPORT", 132, 266);
  ctx.fillStyle = "#1f1b18";
  ctx.font = "900 58px Segoe UI, Arial";
  wrap(ctx, r.headline, 132, 350, 920, 68);
  ctx.fillStyle = "#756b60";
  ctx.font = "26px Segoe UI, Arial";
  wrap(ctx, `${r.user} · ${r.rangeLabel} · ${r.total.toLocaleString()} scrobbles`, 132, 505, 900, 36);
  [["Scrobbles", r.total], ["Tracks", r.tracks], ["Artists", r.artists], ["Peak Day", r.peakDay]].forEach(([label, value], i) => {
    const x = 132 + i * 238;
    ctx.fillStyle = "#f2e9da";
    round(ctx, x, 610, 210, 132, 16);
    ctx.fill();
    ctx.fillStyle = "#1f1b18";
    ctx.font = "900 46px Segoe UI, Arial";
    ctx.fillText(String(value), x + 24, 672);
    ctx.fillStyle = "#756b60";
    ctx.font = "22px Segoe UI, Arial";
    ctx.fillText(label, x + 24, 713);
  });
  ctx.fillStyle = "#1f1b18";
  ctx.font = "900 32px Segoe UI, Arial";
  ctx.fillText("Top Tracks", 132, 830);
  ctx.fillText("Top Albums", 650, 830);
  drawRows(ctx, r.topTracks, 132, 870, "track");
  drawRows(ctx, r.topAlbums, 650, 870, "album");
  ctx.fillStyle = "#0e7c7b";
  round(ctx, 132, 1278, 936, 88, 16);
  ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.font = "700 25px Segoe UI, Arial";
  wrap(ctx, `Recommendation: ${r.recommendation.title}`, 164, 1328, 850, 32);
  return canvas;
}

function drawRows(ctx, rows, x, y, type) {
  rows.slice(0, 5).forEach((item, i) => {
    const yy = y + i * 78;
    ctx.fillStyle = "#fffaf1";
    round(ctx, x, yy, 430, 58, 12);
    ctx.fill();
    ctx.fillStyle = "#d51007";
    ctx.font = "900 22px Segoe UI, Arial";
    ctx.fillText(String(i + 1), x + 18, yy + 37);
    ctx.fillStyle = "#1f1b18";
    ctx.font = "700 21px Segoe UI, Arial";
    ctx.fillText(trunc(type === "album" ? item.album : item.title, 26), x + 58, yy + 30);
    ctx.fillStyle = "#756b60";
    ctx.font = "18px Segoe UI, Arial";
    ctx.fillText(trunc(item.artist, 28), x + 58, yy + 51);
    ctx.fillStyle = "#d51007";
    ctx.font = "900 21px Segoe UI, Arial";
    ctx.fillText(String(item.count), x + 380, yy + 35);
  });
}

function round(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrap(ctx, text, x, y, max, line) {
  const words = String(text).split(" ");
  let current = "";
  for (const word of words) {
    const test = current ? current + " " + word : word;
    if (ctx.measureText(test).width > max && current) {
      ctx.fillText(current, x, y);
      y += line;
      current = word;
    } else {
      current = test;
    }
  }
  if (current) ctx.fillText(current, x, y);
}

function trunc(text, length) {
  text = String(text || "");
  return text.length > length ? text.slice(0, length - 1) + "…" : text;
}

function copyImage() {
  drawCanvas().toBlob(async (blob) => {
    try {
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
      toast("리포트 이미지를 클립보드에 복사했습니다.");
    } catch {
      download(blob);
      toast("클립보드 복사가 막혀 PNG로 다운로드했습니다.");
    }
  }, "image/png");
}

function downloadImage() {
  drawCanvas().toBlob((blob) => {
    download(blob);
    toast("PNG를 다운로드했습니다.");
  }, "image/png");
}

function download(blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `lastfm-${state.report.kind}-${state.report.startDate}.png`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function toast(msg) {
  $("#toast").textContent = msg;
  $("#toast").classList.add("show");
  setTimeout(() => $("#toast").classList.remove("show"), 2400);
}

document.addEventListener("click", (event) => {
  const more = event.target.closest("[data-more]");
  if (more) {
    expandedCharts[more.dataset.more] = !expandedCharts[more.dataset.more];
    renderCharts();
    return;
  }
  const detail = event.target.closest("[data-detail]");
  if (detail) openDetail(JSON.parse(detail.dataset.detail));
});

$$(".tab").forEach((tab) => tab.addEventListener("click", () => {
  $$(".tab").forEach((item) => {
    item.classList.toggle("active", item === tab);
    item.setAttribute("aria-pressed", String(item === tab));
  });
  $$(".chart-section").forEach((section) => section.classList.toggle("active", section.id === tab.dataset.chart));
}));

$("#copyImage").addEventListener("click", copyImage);
$("#downloadImage").addEventListener("click", downloadImage);
$("#dayGrid").addEventListener("click", (event) => {
  const button = event.target.closest(".pace-bar");
  if (!button) return;
  $("#dayGrid [aria-pressed=true]")?.setAttribute("aria-pressed", "false");
  button.setAttribute("aria-pressed", "true");
  $("#paceReadout").textContent = button.getAttribute("aria-label");
});
$("#closeDetail").addEventListener("click", () => $("#detail").close());
$("#detail").addEventListener("click", (event) => {
  if (event.target.id === "detail") $("#detail").close();
});

$("#profilePanel").addEventListener("pointerover", (event) => {
  const item = event.target.closest("[data-profile-item]");
  if (!item) return;
  const previous = event.relatedTarget?.closest?.("[data-profile-item]");
  if (previous?.dataset.profileChart === item.dataset.profileChart && previous?.dataset.profileKey === item.dataset.profileKey) return;
  setProfileHover(item, true);
  showProfileTooltip(item, event);
});

$("#profilePanel").addEventListener("pointermove", (event) => {
  if (event.target.closest("[data-profile-item]")) positionProfileTooltip(event);
});

$("#profilePanel").addEventListener("pointerout", (event) => {
  const item = event.target.closest("[data-profile-item]");
  if (!item) return;
  const next = event.relatedTarget?.closest?.("[data-profile-item]");
  if (next?.dataset.profileChart === item.dataset.profileChart && next?.dataset.profileKey === item.dataset.profileKey) return;
  setProfileHover(item, false);
  hideProfileTooltip();
});

$("#profilePanel").addEventListener("click", (event) => {
  const item = event.target.closest("[data-profile-item]");
  if (item) selectProfileItem(item);
});

$("#profilePanel").addEventListener("keydown", (event) => {
  const item = event.target.closest("[data-profile-item]");
  if (!item || item instanceof HTMLButtonElement || !["Enter", " "].includes(event.key)) return;
  event.preventDefault();
  selectProfileItem(item);
});

$("#profilePanel").addEventListener("focusin", (event) => {
  const item = event.target.closest("[data-profile-item]");
  if (!item) return;
  setProfileHover(item, true);
  showProfileTooltip(item, { target: item });
});

$("#profilePanel").addEventListener("focusout", (event) => {
  const item = event.target.closest("[data-profile-item]");
  if (!item) return;
  setProfileHover(item, false);
  hideProfileTooltip();
});

render();
refreshRegistry();
</script>
</body>
</html>
